<mat-card class="table-card">
    <mat-card-header>
        <mat-card-title>Tabela de Personagens</mat-card-title>
        <mat-card-subtitle>Sobre personagens de Vinte Natural</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <div class="search-container">
            <mat-form-field class="filter-input">
                <mat-label>Pesquisa</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Ex: Aria" #input>
            </mat-form-field>
    
            <mat-form-field class="ancestry-filter">
                <mat-label>Ancestralidade</mat-label>
                <mat-select multiple [(value)]="selectedAncestry" (selectionChange)="filterByAncestries()">
                    @for (ancestry of ancestries; track $index) {
                        <mat-option [value]="ancestry">{{ ancestry }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>

            <button mat-button class="add-character-button btn" (click)="addCharacter()">
                <mat-icon>person_add</mat-icon>
                Adicionar Personagem
            </button>
        </div>
    
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
            <ng-container matColumnDef="name">
                <th mat-header-cell mat-sort-header *matHeaderCellDef> Nome </th>
                <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>
    
            <ng-container matColumnDef="ancestry">
                <th mat-header-cell mat-sort-header *matHeaderCellDef> Ancestralidade </th>
                <td mat-cell *matCellDef="let element"> {{element.ancestry}} </td>
            </ng-container>
    
            <ng-container matColumnDef="pronouns">
                <th mat-header-cell mat-sort-header *matHeaderCellDef> Pronomes </th>
                <td mat-cell *matCellDef="let element"> {{element.pronouns}} </td>
            </ng-container>
    
            <ng-container matColumnDef="class">
                <th mat-header-cell mat-sort-header *matHeaderCellDef> Classe </th>
                <td mat-cell *matCellDef="let element"> {{element.class}} </td>
            </ng-container>
    
            <ng-container matColumnDef="status">
                <th mat-header-cell mat-sort-header *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let element"> {{element.status}} </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Ações </th>
                <td mat-cell *matCellDef="let element" class="flex">
                    <button mat-icon-button class="primary no-bg" (click)="editCharacter(element)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button class="warn no-bg" (click)="deleteCharacter(element)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>
    
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
</mat-card>
