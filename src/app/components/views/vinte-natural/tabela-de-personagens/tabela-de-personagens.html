<table mat-table [dataSource]="personagens" class="mat-elevation-z8">
    <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let personagem"> {{personagem.nome}} </td>
    </ng-container>
    
    <ng-container matColumnDef="classe">
        <th mat-header-cell *matHeaderCellDef> Classe </th>
        <td mat-cell *matCellDef="let personagem"> {{personagem.classe}} </td>
    </ng-container>
    
    <ng-container matColumnDef="nivel">
        <th mat-header-cell *matHeaderCellDef> Nível </th>
        <td mat-cell *matCellDef="let personagem"> {{personagem.nivel}} </td>
    </ng-container>
    
    <tr mat-header-row *matHeaderRowDef="['nome', 'classe', 'nivel']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['nome', 'classe', 'nivel'];"></tr>
</table>
